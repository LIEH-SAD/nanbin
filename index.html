<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nanbin Studio 南滨工作室 — 数字产品设计、品牌策略与技术创新。">
  <link rel="icon" href="https://free.picui.cn/free/2026/07/09/6a4f9c5da363d.png" type="image/x-icon">
  <title>Nanbin Studio · 南滨工作室</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       导航栏
  ============================================================ -->
  <header class="navbar" id="navbar" role="banner">
    <div class="container">
      <a href="#" class="navbar-logo">
        <span class="logo-icon">N</span>
        <span>Nanbin Studio</span>
      </a>
      <nav class="navbar-links" id="navLinks" role="navigation" aria-label="主导航">
        <a href="#showcase">案例</a>
      </nav>
      <button class="navbar-toggle" id="navToggle" aria-label="切换菜单" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="container">
      <div class="carousel">
        <div class="carousel-track" id="carouselTrack">
          <!-- 由 JS 动态渲染 -->
        </div>
        <div class="carousel-controls">
          <button class="carousel-btn" id="carouselPrev" aria-label="上一张">‹</button>
          <div class="carousel-dots" id="carouselDots"></div>
          <button class="carousel-btn" id="carouselNext" aria-label="下一张">›</button>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="showcase">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">Portfolio</span>
        <h2 class="section-title">精选案例</h2>
        <p class="section-desc">每一个项目都是我们对品质的承诺</p>
      </div>
      <div class="showcase-grid" id="showcaseGrid">
        <!-- 由 JS 渲染 -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid" id="footerGrid">
        <!-- 由 JS 渲染 -->
      </div>
      <div class="footer-bottom">
        <span>&copy; 2026 Nanbin Studio. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
