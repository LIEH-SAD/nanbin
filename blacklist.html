<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑名单 - Nanbin工作室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        danger: '#F53F3F',
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .table-responsive {
                @apply overflow-x-auto;
            }
            .nav-link {
                @apply px-4 py-2 text-gray-700 hover:text-primary transition-colors duration-200;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-primary flex items-center">
                        <i class="fa-solid fa-code mr-2"></i>
                        Nanbin工作室
                    </a>
                </div>
                
                <div class="hidden md:flex items-center space-x-2">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="搜索内容..." 
                            class="pl-10 pr-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary w-64"
                        >
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                    
                    <a href="blacklist.html" class="nav-link font-medium text-danger"><i class="fa-solid fa-ban mr-1"></i>黑名单</a>
                    <a href="index.html" class="nav-link"><i class="fa-solid fa-download mr-1"></i>下载</a>
                    <a href="login.html" class="nav-link"><i class="fa-solid fa-user mr-1"></i>登录</a>
                </div>
                
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-gray-700 hover:text-primary">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="mobile-menu" class="md:hidden hidden bg-white border-t border-gray-200">
            <div class="container mx-auto px-4 py-2">
                <div class="relative my-2">
                    <input 
                        type="text" 
                        id="mobile-search-input"
                        placeholder="搜索内容..." 
                        class="pl-10 pr-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary w-full"
                    >
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                
                <div class="flex flex-col space-y-1 py-2">
                    <a href="blacklist.html" class="px-4 py-2 text-danger hover:bg-gray-100 rounded font-medium"><i class="fa-solid fa-ban mr-2"></i>黑名单</a>
                    <a href="index.html" class="px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-primary rounded"><i class="fa-solid fa-download mr-2"></i>下载</a>
                    <a href="login.html" class="px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-primary rounded"><i class="fa-solid fa-user mr-2"></i>登录</a>
                </div>
            </div>
        </div>
    </header>

    <main class="py-10">
        <div class="container mx-auto px-4">
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-danger mb-2">
                    <i class="fa-solid fa-shield-halved mr-2"></i>黑名单列表
                </h1>
                <p class="text-gray-600">本列表展示所有被列入黑名单的用户详细信息</p>
            </div>
            
            <div class="bg-white rounded-xl shadow p-4 md:p-6">
                <div id="loading" class="text-center py-10">
                    <i class="fa-solid fa-spinner fa-spin text-primary text-2xl mb-2"></i>
                    <p class="text-gray-600">正在加载黑名单数据...</p>
                </div>
                
                <div id="empty-data" class="hidden text-center py-10">
                    <i class="fa-solid fa-file-json text-gray-300 text-4xl mb-2"></i>
                    <p class="text-gray-500">暂无黑名单数据</p>
                </div>
                
                <div id="error" class="hidden text-center py-10">
                    <i class="fa-solid fa-triangle-exclamation text-yellow-500 text-4xl mb-2"></i>
                    <p class="text-red-500 mb-4">本地加载JSON失败，已启用内置备用数据</p>
                </div>
                
                <div id="data-table" class="hidden table-responsive">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">持续时间</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">封禁时间</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">QQ</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">原因</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">社交账号1</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">社交账号2</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">社交账号3</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                    
                    <div class="mt-4 text-gray-600 flex justify-between items-center">
                        <p><i class="fa-solid fa-database mr-1"></i> 总计: <span id="total-count" class="font-medium">0</span> 条记录</p>
                        <p class="text-sm text-gray-400">最后更新: <span id="last-update"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-10">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-2">&copy; 2026 Nanbin工作室 版权所有</p>
            <p class="text-gray-400 text-sm">
                <a href="blacklist.html" class="hover:text-danger transition-colors duration-200">黑名单</a> | 
                <a href="index.html" class="hover:text-primary transition-colors duration-200">下载中心</a> | 
                <a href="login.html" class="hover:text-primary transition-colors duration-200">用户登录</a>
            </p>
        </div>
    </footer>

    <script>
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        function handleSearch(inputId) {
            const input = document.getElementById(inputId);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && input.value.trim()) {
                    const searchUrl = `https://cn.bing.com/search?q=${encodeURIComponent(input.value.trim())}`;
                    window.open(searchUrl, '_blank');
                    input.value = '';
                }
            });
        }
        handleSearch('search-input');
        handleSearch('mobile-search-input');

        const backupBlacklistData = [
            {
                "姓名": "备用数据-张三",
                "持续时间": "永久",
                "封禁时间": "2026-01-05",
                "QQ": "123456789",
                "原因": "恶意攻击服务器",
                "社交账号1": "B站：张三123",
                "社交账号2": "抖音：zhangsan123",
                "社交账号3": "MTRBBS：张三"
            }
        ];

        async function loadBlacklistData() {
            let blacklistData = [];
            let useBackup = false;

            try {
                const response = await fetch('blacklist.json');
                if (response.ok) {
                    blacklistData = await response.json();
                } else {
                    useBackup = true;
                }
            } catch (error) {
                useBackup = true;
            }

            if (useBackup) {
                blacklistData = backupBlacklistData;
                document.getElementById('error').classList.remove('hidden');
            }

            document.getElementById('loading').classList.add('hidden');
            
            if (blacklistData.length === 0) {
                document.getElementById('empty-data').classList.remove('hidden');
                return;
            }

            renderBlacklistTable(blacklistData);
            
            document.getElementById('total-count').textContent = blacklistData.length;
            document.getElementById('last-update').textContent = new Date().toLocaleString();
            document.getElementById('data-table').classList.remove('hidden');
        }

        function renderBlacklistTable(data) {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-gray-50 hover:bg-gray-100' : 'bg-white hover:bg-gray-100';
                
                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">${item.姓名 || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-danger font-medium">${item.持续时间 || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${item.封禁时间 || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${item.QQ || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${item.原因 || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${item.社交账号1 || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${item.社交账号2 || '-'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${item.社交账号3 || '-'}</td>
                `;
                
                tableBody.appendChild(tr);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBlacklistData();
        });
    </script>
</body>
</html>
